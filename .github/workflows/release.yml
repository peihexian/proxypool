name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Build ${{ matrix.artifact }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-amd64
            bin: myproxy
            archive: tar.gz
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            bin: myproxy
            archive: tar.gz
          - os: windows-latest
            artifact: windows-amd64
            bin: myproxy.exe
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build backend
        working-directory: backend
        run: cargo build --release --locked

      - name: Pack (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          STAGE="proxypool-${TAG}-${ARTIFACT}"
          mkdir -p "${STAGE}/frontend" "${STAGE}/deploy"
          install -m 0755 "backend/target/release/${BIN}" "${STAGE}/myproxy"
          cp -a frontend/dist "${STAGE}/frontend/dist"
          cp deploy/proxypool.service "${STAGE}/deploy/"
          cp deploy/install-release.sh "${STAGE}/install.sh"
          chmod +x "${STAGE}/install.sh"
          cp README.md LICENSE "${STAGE}/"
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          ls -lh "${STAGE}.tar.gz"

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $stage = "proxypool-$tag-$env:ARTIFACT"
          New-Item -ItemType Directory -Force -Path "$stage/frontend", "$stage/deploy" | Out-Null
          Copy-Item backend/target/release/myproxy.exe "$stage/myproxy.exe"
          Copy-Item -Recurse frontend/dist "$stage/frontend/dist"
          Copy-Item deploy/run.bat "$stage/run.bat"
          Copy-Item README.md, LICENSE "$stage/"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Get-Item "$stage.zip" | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.artifact }}
          path: |
            proxypool-*.tar.gz
            proxypool-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: backend
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum proxypool-*.tar.gz proxypool-*.zip > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/proxypool-*.tar.gz
            dist/proxypool-*.zip
            dist/SHA256SUMS.txt
